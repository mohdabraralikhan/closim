<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CLOTHSIM — 3D Garment Workspace (G10)</title>
  <style>
    :root {
      --panel-bg: rgba(24, 27, 33, 0.92);
      --panel-border: #3a4048;
      --text: #d6dae0;
      --text-dim: #8b929c;
      --accent: #ffc04d;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #20242a;
      font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px;
      color: var(--text);
    }
    #viewport { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: absolute; inset: 0; pointer-events: none; }
    .panel {
      position: absolute; background: var(--panel-bg);
      border: 1px solid var(--panel-border); border-radius: 6px;
      padding: 8px 10px; pointer-events: auto; user-select: none;
      max-height: 45vh; overflow: auto;
    }
    .panel h3 { margin: 0 0 6px 0; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
    #info { top: 10px; left: 10px; min-width: 210px; }
    #view-tools { top: 10px; right: 10px; width: 190px; }
    #outliner { top: 260px; right: 10px; width: 190px; }
    #sim-panel { bottom: 34px; left: 50%; transform: translateX(-50%); }
    #status-bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
      background: var(--panel-bg); border-top: 1px solid var(--panel-border);
      display: flex; align-items: center; gap: 14px; padding: 0 10px;
      font-size: 11px; color: var(--text-dim); pointer-events: auto; white-space: nowrap; overflow: hidden;
    }
    button {
      background: #2c313a; color: var(--text); border: 1px solid var(--panel-border);
      border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 11px; margin: 1px;
    }
    button:hover { background: #3a4150; }
    button.primary { background: #3d5a80; border-color: #56789e; }
    button.warn { background: #6e3b3b; border-color: #8e5252; }
    button.active { background: #3d5a80; border-color: var(--accent); color: var(--accent); }
    label.chk { display: inline-flex; align-items: center; gap: 4px; margin: 1px 4px 1px 0; cursor: pointer; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 3px 0; }
    .kv { display: flex; justify-content: space-between; gap: 12px; margin: 1px 0; }
    .kv .k { color: var(--text-dim); }
    .list-item {
      padding: 2px 6px; border-radius: 3px; cursor: pointer; display: flex; justify-content: space-between;
    }
    .list-item:hover { background: #323945; }
    .list-item.selected { background: #3d5a80; }
    .list-item .dim { color: var(--text-dim); font-size: 10px; }
    #help {
      position: absolute; left: 10px; bottom: 34px; max-width: 340px;
      font-size: 10px; color: var(--text-dim); line-height: 1.5;
    }
    #production-toggle { position: absolute; right: 10px; bottom: 34px; }
    #production-dashboard {
      position: absolute; right: 10px; bottom: 70px; width: min(420px, calc(100vw - 20px));
      max-height: 68vh; overflow: auto; line-height: 1.45;
    }
    #production-dashboard[hidden] { display: none; }
    #production-dashboard p { margin: 5px 0; }
    #production-dashboard ul { margin: 4px 0; padding-left: 20px; }
    #production-dashboard input { width: 150px; margin: 3px; }
    #production-dashboard table { width: 100%; border-collapse: collapse; margin: 6px 0; }
    #production-dashboard th, #production-dashboard td { text-align: left; padding: 2px 4px; border-bottom: 1px solid var(--panel-border); }
    #production-dashboard img { display: block; max-width: 100%; max-height: 220px; background: white; margin-top: 6px; }
    .production-error { color: #ff8c8c; }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div id="hud">
    <div id="info" class="panel"></div>
    <div id="view-tools" class="panel"></div>
    <div id="outliner" class="panel"></div>
    <div id="sim-panel" class="panel"></div>
    <div id="help" class="panel"></div>
    <button id="production-toggle" aria-expanded="false">Production readiness</button>
    <div id="production-dashboard" class="panel" aria-label="Manufacturing readiness dashboard"></div>
    <div id="status-bar"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
